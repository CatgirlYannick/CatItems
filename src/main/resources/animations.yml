# CatItems arm-emote timelines. Twenty ticks equal one second.
# arm-pose uses Minecraft's real held-item arm animations; no keyframe forces the player's head.
config-version: 5

animations:
  smoke_joint:
    duration-ticks: 48
    lock-movement: true
    keyframes:
      - {at: 0, item-pose: low, arm-pose: rest, body-pose: standing, body-yaw: 0, sound: BLOCK_CAMPFIRE_CRACKLE, volume: 0.4, pitch: 1.2}
      - {at: 3, item-pose: approach, arm-pose: keep, body-pose: standing, body-yaw: -2}
      - {at: 6, item-pose: contact, arm-pose: face, body-pose: standing, body-yaw: -5}
      - {at: 13, item-pose: mouth, arm-pose: keep, body-pose: crouching, body-yaw: -8, particle: SMOKE, particle-anchor: mouth, particle-count: 2}
      - {at: 21, item-pose: contact, arm-pose: keep, body-pose: crouching, body-yaw: -5, particle: CAMPFIRE_COSY_SMOKE, particle-anchor: mouth, particle-count: 2}
      - {at: 27, item-pose: release, arm-pose: rest, body-pose: standing, body-yaw: 0, sound: ENTITY_PLAYER_BREATH, volume: 0.55, pitch: 0.82, particle: CLOUD, particle-anchor: mouth, particle-count: 3}
      - {at: 32, item-pose: approach, arm-pose: keep, body-pose: standing, body-yaw: 2}
      - {at: 35, item-pose: contact, arm-pose: face, body-pose: standing, body-yaw: 5, particle: SMOKE, particle-anchor: mouth, particle-count: 2}
      - {at: 40, item-pose: release, arm-pose: rest, body-pose: standing, body-yaw: -2}
      - {at: 42, item-pose: extend, arm-pose: keep, body-pose: standing, body-yaw: -4, sound: ENTITY_PLAYER_BREATH, volume: 0.5, pitch: 0.72, particle: CAMPFIRE_COSY_SMOKE, particle-anchor: mouth, particle-count: 5, particle-spread: 0.1}
      - {at: 48, item-pose: rest, arm-pose: rest, body-pose: standing, body-yaw: 0}

  smoke_pipe:
    duration-ticks: 52
    lock-movement: true
    keyframes:
      - {at: 0, item-pose: low, arm-pose: rest, body-pose: standing, body-yaw: 0}
      - {at: 3, item-pose: approach, arm-pose: keep, body-pose: standing, body-yaw: 3}
      - {at: 7, item-pose: contact, arm-pose: face, body-pose: crouching, body-yaw: 6}
      - {at: 14, item-pose: mouth, arm-pose: keep, body-pose: crouching, body-yaw: 9, sound: BLOCK_CAMPFIRE_CRACKLE, volume: 0.5, pitch: 0.8}
      - {at: 22, item-pose: contact, arm-pose: keep, body-pose: crouching, body-yaw: 5, particle: SMOKE, particle-anchor: mouth, particle-count: 2}
      - {at: 29, item-pose: release, arm-pose: rest, body-pose: standing, body-yaw: 0}
      - {at: 39, item-pose: extend, arm-pose: rest, body-pose: standing, body-yaw: -6, sound: ENTITY_PLAYER_BREATH, volume: 0.6, pitch: 0.65, particle: CAMPFIRE_COSY_SMOKE, particle-anchor: mouth, particle-count: 6}
      - {at: 46, item-pose: low, arm-pose: rest, body-pose: standing, body-yaw: 3}
      - {at: 52, item-pose: rest, arm-pose: rest, body-pose: standing, body-yaw: 0}

  smoke_stimulant:
    duration-ticks: 34
    lock-movement: true
    keyframes:
      - {at: 0, item-pose: low, arm-pose: rest, body-pose: standing, body-yaw: 0, easing: ease_out}
      - {at: 2, item-pose: approach, arm-pose: keep, body-pose: standing, body-yaw: -3}
      - {at: 4, item-pose: contact, arm-pose: face, body-pose: crouching, body-yaw: -8}
      - {at: 8, item-pose: mouth, arm-pose: keep, body-pose: crouching, body-yaw: 7, sound: BLOCK_FIRE_EXTINGUISH, volume: 0.35, pitch: 1.55}
      - {at: 13, item-pose: contact, arm-pose: keep, body-pose: standing, body-yaw: -9, particle: WHITE_SMOKE, particle-anchor: mouth, particle-count: 3}
      - {at: 16, item-pose: release, arm-pose: rest, body-pose: standing, body-yaw: 0}
      - {at: 18, item-pose: shake_up, arm-pose: brush, body-pose: crouching, body-yaw: 9, sound: ENTITY_PLAYER_BREATH, volume: 0.7, pitch: 1.45}
      - {at: 23, item-pose: shake_down, arm-pose: brush, body-pose: standing, body-yaw: -8, particle: ELECTRIC_SPARK, particle-anchor: eye, particle-count: 3}
      - {at: 29, item-pose: low, arm-pose: rest, body-pose: standing, body-yaw: 4}
      - {at: 34, item-pose: rest, arm-pose: rest, body-pose: standing, body-yaw: 0}

  snort_line:
    duration-ticks: 38
    lock-movement: true
    keyframes:
      - {at: 0, item-pose: low, arm-pose: rest, body-pose: standing, body-yaw: 0}
      - {at: 6, item-pose: extend, arm-pose: rest, body-pose: crouching, body-yaw: -5}
      - {at: 9, item-pose: approach, arm-pose: keep, body-pose: crouching, body-yaw: -6}
      - {at: 12, item-pose: contact, arm-pose: face_both, body-pose: crouching, body-yaw: -8}
      - {at: 17, item-pose: mouth, arm-pose: keep, body-pose: crouching, body-yaw: -10, sound: ENTITY_PLAYER_BREATH, volume: 0.75, pitch: 1.4, particle: CLOUD, particle-anchor: mouth, particle-count: 2}
      - {at: 21, item-pose: release, arm-pose: rest, body-pose: standing, body-yaw: 7, easing: ease_out}
      - {at: 27, item-pose: shake_down, arm-pose: brush, body-pose: crouching, body-yaw: -5, sound: ENTITY_PLAYER_BREATH, volume: 0.5, pitch: 0.75, particle: WHITE_SMOKE, particle-anchor: mouth, particle-count: 2}
      - {at: 33, item-pose: low, arm-pose: rest, body-pose: standing, body-yaw: 3}
      - {at: 38, item-pose: rest, arm-pose: rest, body-pose: standing, body-yaw: 0}

  drink_bottle:
    duration-ticks: 40
    lock-movement: true
    keyframes:
      - {at: 0, item-pose: low, arm-pose: rest, body-pose: standing, body-yaw: 0, sound: ITEM_BOTTLE_FILL, volume: 0.4, pitch: 1.15}
      - {at: 3, item-pose: approach, arm-pose: keep, body-pose: standing, body-yaw: -1}
      - {at: 6, item-pose: contact, arm-pose: drink, body-pose: standing, body-yaw: -3}
      - {at: 11, item-pose: mouth, arm-pose: keep, body-pose: standing, body-yaw: -5, sound: ENTITY_GENERIC_DRINK, volume: 0.6, pitch: 0.95}
      - {at: 17, item-pose: mouth, arm-pose: keep, body-pose: standing, body-yaw: 4, sound: ENTITY_GENERIC_DRINK, volume: 0.5, pitch: 1.05, particle: SPLASH, particle-anchor: mouth, particle-count: 2}
      - {at: 24, item-pose: contact, arm-pose: keep, body-pose: crouching, body-yaw: -5, sound: ENTITY_GENERIC_DRINK, volume: 0.5, pitch: 0.9}
      - {at: 29, item-pose: release, arm-pose: rest, body-pose: standing, body-yaw: 2}
      - {at: 35, item-pose: low, arm-pose: rest, body-pose: standing, body-yaw: 0, sound: ENTITY_PLAYER_BURP, volume: 0.35, pitch: 1.2}
      - {at: 40, item-pose: rest, arm-pose: rest, body-pose: standing, body-yaw: 0}

  eat_edible:
    duration-ticks: 44
    lock-movement: true
    keyframes:
      - {at: 0, item-pose: low, arm-pose: rest, body-pose: standing, body-yaw: 0}
      - {at: 3, item-pose: approach, arm-pose: keep, body-pose: standing, body-yaw: -1}
      - {at: 6, item-pose: contact, arm-pose: eat, body-pose: standing, body-yaw: -3, sound: ENTITY_GENERIC_EAT, volume: 0.55, pitch: 1.1}
      - {at: 12, item-pose: mouth, arm-pose: keep, body-pose: crouching, body-yaw: 4, sound: ENTITY_GENERIC_EAT, volume: 0.5, pitch: 0.9, particle: ENCHANTED_HIT, particle-anchor: mouth, particle-count: 3}
      - {at: 18, item-pose: contact, arm-pose: keep, body-pose: standing, body-yaw: -4, sound: ENTITY_GENERIC_EAT, volume: 0.55, pitch: 1.2}
      - {at: 25, item-pose: mouth, arm-pose: keep, body-pose: crouching, body-yaw: 5, sound: ENTITY_GENERIC_EAT, volume: 0.5, pitch: 1.0}
      - {at: 32, item-pose: contact, arm-pose: keep, body-pose: standing, body-yaw: -3, sound: ENTITY_GENERIC_EAT, volume: 0.55, pitch: 0.85}
      - {at: 37, item-pose: release, arm-pose: rest, body-pose: standing, body-yaw: 2, sound: ENTITY_PLAYER_BURP, volume: 0.4, pitch: 1.1}
      - {at: 44, item-pose: rest, arm-pose: rest, body-pose: standing, body-yaw: 0}

  inhale_vape:
    duration-ticks: 42
    lock-movement: true
    keyframes:
      - {at: 0, item-pose: low, arm-pose: rest, body-pose: standing, body-yaw: 0}
      - {at: 3, item-pose: approach, arm-pose: keep, body-pose: standing, body-yaw: 2}
      - {at: 6, item-pose: contact, arm-pose: face, body-pose: standing, body-yaw: 4, sound: ITEM_BOTTLE_FILL_DRAGONBREATH, volume: 0.42, pitch: 1.35}
      - {at: 12, item-pose: mouth, arm-pose: keep, body-pose: crouching, body-yaw: 6, sound: ENTITY_PLAYER_BREATH, volume: 0.65, pitch: 1.2, particle: CLOUD, particle-anchor: mouth, particle-count: 3}
      - {at: 20, item-pose: contact, arm-pose: keep, body-pose: crouching, body-yaw: 4, particle: WHITE_SMOKE, particle-anchor: mouth, particle-count: 2}
      - {at: 26, item-pose: release, arm-pose: rest, body-pose: standing, body-yaw: -2}
      - {at: 34, item-pose: extend, arm-pose: rest, body-pose: standing, body-yaw: -6, sound: ENTITY_PLAYER_BREATH, volume: 0.58, pitch: 0.68, particle: CLOUD, particle-anchor: mouth, particle-count: 6, particle-spread: 0.12}
      - {at: 38, item-pose: shake_down, arm-pose: brush, body-pose: standing, body-yaw: 3}
      - {at: 42, item-pose: rest, arm-pose: rest, body-pose: standing, body-yaw: 0}

  inject_arm:
    duration-ticks: 42
    lock-movement: true
    keyframes:
      - {at: 0, item-pose: low, arm-pose: rest, body-pose: standing, body-yaw: 0, sound: ITEM_BOTTLE_EMPTY, volume: 0.35, pitch: 1.45}
      - {at: 3, item-pose: forearm, arm-pose: keep, body-pose: standing, body-yaw: 4}
      - {at: 6, item-pose: chest, arm-pose: crossbow, body-pose: crouching, body-yaw: 8}
      - {at: 12, item-pose: chest, arm-pose: keep, body-pose: crouching, body-yaw: 12, sound: ITEM_TRIDENT_RETURN, volume: 0.45, pitch: 1.55}
      - {at: 19, item-pose: chest, arm-pose: keep, body-pose: crouching, body-yaw: 14, particle: ELECTRIC_SPARK, particle-anchor: hand, particle-count: 2}
      - {at: 25, item-pose: forearm, arm-pose: keep, body-pose: crouching, body-yaw: 7, sound: BLOCK_BREWING_STAND_BREW, volume: 0.35, pitch: 1.4}
      - {at: 30, item-pose: aftercare, arm-pose: rest, body-pose: standing, body-yaw: -4}
      - {at: 37, item-pose: low, arm-pose: rest, body-pose: standing, body-yaw: 2}
      - {at: 42, item-pose: rest, arm-pose: rest, body-pose: standing, body-yaw: 0}

  ritual_sway:
    duration-ticks: 58
    lock-movement: true
    keyframes:
      - {at: 0, item-pose: low, arm-pose: rest, body-pose: standing, body-yaw: 0, sound: BLOCK_BREWING_STAND_BREW, volume: 0.55, pitch: 0.72, particle: ENCHANT, particle-anchor: hand, particle-count: 4}
      - {at: 8, item-pose: extend, arm-pose: bow, body-pose: crouching, body-yaw: -10, particle: WITCH, particle-anchor: hand, particle-count: 3}
      - {at: 16, item-pose: extend, arm-pose: bow, body-pose: standing, body-yaw: 12, sound: BLOCK_AMETHYST_BLOCK_CHIME, volume: 0.45, pitch: 0.85, particle: PORTAL, particle-anchor: eye, particle-count: 4}
      - {at: 24, item-pose: extend, arm-pose: bow, body-pose: crouching, body-yaw: -14, particle: ENCHANT, particle-anchor: hand, particle-count: 5}
      - {at: 33, item-pose: extend, arm-pose: bow, body-pose: standing, body-yaw: 15, sound: BLOCK_AMETHYST_BLOCK_CHIME, volume: 0.45, pitch: 1.15, particle: WITCH, particle-anchor: eye, particle-count: 4}
      - {at: 38, item-pose: approach, arm-pose: rest, body-pose: crouching, body-yaw: -9}
      - {at: 41, item-pose: contact, arm-pose: drink, body-pose: crouching, body-yaw: -7, sound: ENTITY_GENERIC_DRINK, volume: 0.45, pitch: 0.75}
      - {at: 50, item-pose: raise, arm-pose: trident, body-pose: standing, body-yaw: 6, sound: ENTITY_ENDERMAN_AMBIENT, volume: 0.4, pitch: 1.45, particle: REVERSE_PORTAL, particle-anchor: eye, particle-count: 7}
      - {at: 58, item-pose: rest, arm-pose: rest, body-pose: standing, body-yaw: 0}

  swallow_pill:
    duration-ticks: 32
    lock-movement: true
    keyframes:
      - {at: 0, item-pose: low, arm-pose: rest, body-pose: standing, body-yaw: 0}
      - {at: 2, item-pose: approach, arm-pose: keep, body-pose: standing, body-yaw: -1}
      - {at: 5, item-pose: contact, arm-pose: face, body-pose: standing, body-yaw: -2}
      - {at: 10, item-pose: mouth, arm-pose: keep, body-pose: standing, body-yaw: -4, sound: ENTITY_GENERIC_EAT, volume: 0.35, pitch: 1.35}
      - {at: 14, item-pose: contact, arm-pose: rest, body-pose: standing, body-yaw: 1}
      - {at: 16, item-pose: tilt_left, arm-pose: drink, body-pose: standing, body-yaw: 4, sound: ENTITY_GENERIC_DRINK, volume: 0.45, pitch: 1.2}
      - {at: 21, item-pose: raise, arm-pose: keep, body-pose: crouching, body-yaw: -3, sound: ENTITY_PLAYER_BREATH, volume: 0.35, pitch: 1.05}
      - {at: 25, item-pose: release, arm-pose: rest, body-pose: standing, body-yaw: 2}
      - {at: 29, item-pose: low, arm-pose: rest, body-pose: standing, body-yaw: 0}
      - {at: 32, item-pose: rest, arm-pose: rest, body-pose: standing, body-yaw: 0}
